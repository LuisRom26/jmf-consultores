<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — JMF Consultores</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #0f172a;
      }
      .card {
        max-width: 560px;
        padding: 2rem 2.5rem;
        background: white;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 4vw, 3rem); }
      p { margin: 0 0 1.5rem; color: #475569; }
      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        background: #00004d;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>La página que buscas no existe o fue movida.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
