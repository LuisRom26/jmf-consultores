<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Página no encontrada — JMF Consultores</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #00004d 0%, #000035 70%, #0a0a6e 100%);
        color: #0a0a23;
      }
      .card {
        max-width: 560px;
        padding: 2rem 2.5rem;
        background: white;
        border-top: 4px solid #f50b0b;
        border-radius: 8px;
        box-shadow: 0 22px 54px rgba(0, 0, 0, 0.3);
        text-align: center;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 4vw, 3rem); }
      p { margin: 0 0 1.5rem; color: #475569; }
      a {
        display: inline-block;
        padding: 0.8rem 1.2rem;
        background: #d00909;
        color: white;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 600;
      }
      a:hover { background: #a80707; }
      a:focus-visible { outline: 3px solid #00004d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>404</h1>
      <p>La página que buscas no existe o fue movida.</p>
      <a href="./index.html">Volver al inicio</a>
    </main>
  </body>
</html>
